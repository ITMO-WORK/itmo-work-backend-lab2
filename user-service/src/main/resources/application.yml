spring:
  application:
    name: user-service
  profiles:
    active: ${PROFILE:dev}
  config:
    activate:
      on-profile: ${PROFILE:dev}
    import: configserver:${CONFIG_SERVER_URL:http://localhost:9991}
server:
  port: 8081

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

  profiles:
    active: ${PROFILE:dev}

  config:
    import: configserver:http://config-server:9991
    activate:
      on-profile: ${PROFILE:dev}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false


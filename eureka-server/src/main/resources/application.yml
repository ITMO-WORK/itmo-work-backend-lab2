server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: configserver:http://config-server:9991

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false